version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: h4wk5int-postgres
    environment:
      POSTGRES_DB: h4wk5int
      POSTGRES_USER: h4wk5int
      POSTGRES_PASSWORD: h4wk5int_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - h4wk5int-network
    restart: unless-stopped

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: h4wk5int-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - h4wk5int-network
    restart: unless-stopped

  # Tor proxy for anonymized requests
  tor:
    image: dperson/torproxy
    container_name: h4wk5int-tor
    ports:
      - "9050:9050"
      - "9051:9051"
    environment:
      - TORUSER=h4wk5int
    networks:
      - h4wk5int-network
    restart: unless-stopped

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: h4wk5int-backend
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://h4wk5int:h4wk5int_password@postgres:5432/h4wk5int
      - REDIS_URL=redis://redis:6379/0
      - TOR_PROXY=socks5://tor:9050
      - USE_TOR=true
      - SECRET_KEY=your-production-secret-key-change-this
      - JWT_SECRET=your-production-jwt-secret-change-this
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - tor
    networks:
      - h4wk5int-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: h4wk5int-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - h4wk5int-network
    restart: unless-stopped

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: h4wk5int-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - h4wk5int-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  h4wk5int-network:
    driver: bridge